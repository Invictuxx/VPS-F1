name: Grabar stream y subir a Filester

on:
  workflow_dispatch:
    inputs:
      recording_duration:
        description: "Duración de la grabación en segundos"
        required: false
        default: "7200"
  schedule:
    # Todos los días a las 23:00 UTC
    - cron: "0 23 * * *"

# Evita que se acumulen ejecuciones si una anterior sigue corriendo
concurrency:
  group: recorder-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RECORDING_DURATION: ${{ github.event.inputs.recording_duration || '7200' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos del repositorio
        shell: bash
        run: |
          set -e
          missing=0

          for f in recorder.py requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta el archivo '$f' en la raíz del repositorio."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "Archivos encontrados en el checkout:"
            ls -la
            exit 1
          fi

          echo "Archivos del repositorio OK."

      - name: Validar secrets requeridos
        shell: bash
        run: |
          set -e
          missing=0

          if [ -z "${{ secrets.STREAM_PAGE_URL }}" ]; then
            echo "::error::Falta el secret STREAM_PAGE_URL"
            missing=1
          fi

          if [ -z "${{ secrets.FILESTER_API_KEY }}" ]; then
            echo "::error::Falta el secret FILESTER_API_KEY"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "Secrets OK."

      - name: Instalar ffmpeg
        run: |
          Write-Host "======================================================================"
          Write-Host "INSTALANDO FFMPEG"
          Write-Host "======================================================================"
          
          choco install ffmpeg -y
          
          Write-Host ""
          Write-Host "FFmpeg:"
          ffmpeg -version | Select-Object -First 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar grabador
        env:
          STREAM_PAGE_URL: ${{ secrets.STREAM_PAGE_URL }}
          FILESTER_API_KEY: ${{ secrets.FILESTER_API_KEY }}
          FILESTER_FOLDER_ID: ${{ secrets.FILESTER_FOLDER_ID }}
        run: |
          Write-Host "======================================================================"
          Write-Host "INICIANDO GRABADOR"
          Write-Host "======================================================================"
          Write-Host "RECORDING_DURATION=$env:RECORDING_DURATION"

          python recorder.py

      - name: Subir archivos de trabajo si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-debug-${{ github.run_id }}
          path: work\
          retention-days: 3
          if-no-files-found: ignore
