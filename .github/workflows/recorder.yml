name: Grabar stream y subir a Filester

on:
  workflow_dispatch:
    inputs:
      recording_duration:
        description: "Duración de la grabación en segundos"
        required: false
        default: "7200"
  schedule:
    # Todos los días a las 23:00 UTC
    - cron: "0 23 * * *"

# Evita que se acumulen ejecuciones si una anterior sigue corriendo
concurrency:
  group: recorder-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RECORDING_DURATION: ${{ github.event.inputs.recording_duration || '7200' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar archivos del repositorio
        run: |
          \(missing =\)false
          foreach ($f in "recorder.py", "requirements.txt") {
            if (-Not (Test-Path $f)) {
              Write-Host "::error::Falta el archivo '$f' en la raíz del repositorio."
              \(missing =\)true
            }
          }

          if ($missing) {
            Write-Host "Archivos encontrados en el checkout:"
            Get-ChildItem
            exit 1
          }

          Write-Host "Archivos del repositorio OK."

      - name: Validar secrets requeridos
        run: |
          \(missing =\)false

          if ([string]::IsNullOrWhiteSpace("${{ secrets.STREAM_PAGE_URL }}")) {
            Write-Host "::error::Falta el secret STREAM_PAGE_URL"
            \(missing =\)true
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.FILESTER_API_KEY }}")) {
            Write-Host "::error::Falta el secret FILESTER_API_KEY"
            \(missing =\)true
          }

          if ($missing) {
            exit 1
          }

          Write-Host "Secrets OK."

      - name: Instalar ffmpeg
        run: |
          Write-Host "======================================================================"
          Write-Host "INSTALANDO FFMPEG"
          Write-Host "======================================================================"
          
          choco install ffmpeg -y
          
          Write-Host ""
          Write-Host "FFmpeg:"
          ffmpeg -version | Select-Object -First 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar grabador
        env:
          STREAM_PAGE_URL: ${{ secrets.STREAM_PAGE_URL }}
          FILESTER_API_KEY: ${{ secrets.FILESTER_API_KEY }}
          FILESTER_FOLDER_ID: ${{ secrets.FILESTER_FOLDER_ID }}
        run: |
          Write-Host "======================================================================"
          Write-Host "INICIANDO GRABADOR"
          Write-Host "======================================================================"
          Write-Host "RECORDING_DURATION=$env:RECORDING_DURATION"

          python recorder.py

      - name: Subir archivos de trabajo si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-debug-${{ github.run_id }}
          path: work\
          retention-days: 3
          if-no-files-found: ignore
