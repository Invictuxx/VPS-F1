name: Grabar stream directo y subir a Filester

on:
  workflow_dispatch:
   inputs:
     file_name:
      description: "Nombre del archivo (sin extensión). Vacío = automático"
      required: false
      default: ""
# Evita que se solapen ejecuciones si una tarda más de la cuenta
concurrency:
  group: recorder-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: windows-latest
    # El trabajo terminará en ~3 horas, pero mantenemos el límite en 6 por seguridad
    timeout-minutes: 360

    env:
      # Evita errores de caracteres especiales en la consola de Windows
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar secrets requeridos
        run: |
          $missing = $false
          if ([string]::IsNullOrWhiteSpace("${{ secrets.STREAM_PAGE_URL }}")) {
            Write-Host "::error::Falta el secret STREAM_PAGE_URL"
            $missing = $true
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.FILESTER_API_KEY }}")) {
            Write-Host "::error::Falta el secret FILESTER_API_KEY"
            $missing = $true
          }
          if ($missing) { exit 1 }
          Write-Host "Secrets OK."

      - name: Instalar FFmpeg
        run: |
          choco install ffmpeg -y
          ffmpeg -version | Select-Object -First 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias Python
        # El script simplificado solo necesita requests (ya no necesita requirements.txt complejo)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar grabador
        env:
          STREAM_PAGE_URL: ${{ secrets.STREAM_PAGE_URL }}
          FILESTER_API_KEY: ${{ secrets.FILESTER_API_KEY }}
          FILESTER_FOLDER_ID: ${{ secrets.FILESTER_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_FILE_NAME: ${{ github.event.inputs.file_name }}
        run: |
          python recorder.py
